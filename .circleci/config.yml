# See https://circleci.com/docs/2.0/reusing-config/
version: 2.1

jobs:
  "Test":
    resource_class: small
    docker:
      - image: "cimg/base:2026.09"
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y autotools-dev libgsl-dev clang-20
      - run:
          name: Test c99sh
          command: |
            CC=/usr/bin/clang-20 CXX=/usr/bin/clang++-20 ./tests

workflows:
  build:
    jobs:
      - "Test"
